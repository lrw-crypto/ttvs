<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2fa9f5">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}</style>
<title>草商探索趣</title>
<meta name="description" content="草商探索趣：今天換你當草屯商工新生！帶著探索護照逛校園、完成科別小任務收集金幣，找到你想挑戰的方向。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: full-screen toy campus; a "passport" HUD (coins + tasks) floats top-left, the building card slides in on the right (bottom sheet on phones), mini-games open as a centered passport page. */
:root{
  --paper:#fffaf1;      /* passport paper */
  --paper-2:#fff0dc;
  --ink:#3d3040;        /* plum ink */
  --muted:#8a7a80;
  --line:#f3dcc0;
  --brick:#ff6f5e;      /* coral brick */
  --roof:#5a636c;       /* slate roof */
  --pav:#1fa2e6;        /* pavilion blue */
  --lawn:#3cbf55;
  --grape:#9b6bdf;
  --coin:#ffc531;
  --coin-ink:#6b4b00;
  --good:#3f9d4b; --bad:#d9573f;
  --sky-bg:#bfe9ff;
  --shadow:0 5px 0 rgba(255,140,90,.22), 0 14px 30px rgba(90,40,30,.14);
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Nunito","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#2d2a30; --paper-2:#3a3540; --ink:#f4ebe3; --muted:#bcaea6; --line:#4c4550;
  --brick:#ff8a7a; --roof:#9aa4ad; --pav:#4ab8f0; --lawn:#5fd474; --grape:#b48cf0; --coin-ink:#4a3400;
  --sky-bg:#1f2a3a; --shadow:0 5px 0 rgba(0,0,0,.35), 0 14px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#2d2a30; --paper-2:#3a3540; --ink:#f4ebe3; --muted:#bcaea6; --line:#4c4550;
  --brick:#ff8a7a; --roof:#9aa4ad; --pav:#4ab8f0; --lawn:#5fd474; --grape:#b48cf0; --coin-ink:#4a3400;
  --sky-bg:#1f2a3a; --shadow:0 5px 0 rgba(0,0,0,.35), 0 14px 30px rgba(0,0,0,.35); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky-bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:900}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:var(--paper);box-shadow:0 4px 0 rgba(110,70,60,.18);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(110,70,60,.2)}
.btn.main{background:var(--brick);border-color:transparent;color:#fff;box-shadow:0 4px 0 #d9503f}
#passBtn{background:var(--brick);color:#fff;border-color:transparent;box-shadow:0 4px 0 #d9503f}
#homeBtn{background:var(--pav);color:#fff;border-color:transparent;box-shadow:0 4px 0 #1680b8}
#infoBtn{background:var(--lawn);color:#fff;border-color:transparent;box-shadow:0 4px 0 #2b9441}
#taskBtn{background:var(--grape);color:#fff;border-color:transparent;box-shadow:0 4px 0 #7a4fc0}
.rb span:nth-child(5n+1){color:#3cbf55}.rb span:nth-child(5n+2){color:#ff6f5e}.rb span:nth-child(5n+3){color:#1fa2e6}.rb span:nth-child(5n+4){color:#ffb000}.rb span:nth-child(5n+5){color:#9b6bdf}
.bt.road{background:#5d6269;color:#fff;border-color:#454a50;font-family:var(--f-body);font-weight:700;font-size:11.5px}
.bt.land{background:#ffd23f;color:#4a3500;border-color:#e0b000;font-size:13px}
.btn.go{background:var(--lawn);border-color:transparent;color:#fff;box-shadow:0 4px 0 #3f8a33}
.btn.on{background:#ffe1ea;border-color:#f0a3b8;color:#a33a5a}
.btn svg{width:18px;height:18px}
.coin{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0 18%,#f7cf45 19% 62%,#d9a514 63%);box-shadow:inset 0 0 0 2px #c38f0b;vertical-align:-.2em;flex:none}

/* ---------- HUD ---------- */
#top{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
#brand{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;pointer-events:auto}
#brand h1{font-size:22px;line-height:1;letter-spacing:.06em}
#brand p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
#coinBtn{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:18px;font-size:15px}
#coinBtn .num{font-size:22px;line-height:1}
#coinBtn small{font-size:11.5px;color:var(--muted);font-weight:700}
#tools{margin-left:auto;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}

#tasks{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:92px;width:260px;max-height:calc(100% - 170px);display:flex;flex-direction:column;z-index:4;overflow:hidden}
#tasks header{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
#tasks h2{font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
#tasks h2 .num{font-size:15px;color:var(--muted)}
.prog{height:10px;border-radius:6px;background:var(--paper-2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--coin),#f7a531);border-radius:6px;transition:width .6s}
#taskList{list-style:none;margin:0;padding:2px 8px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.tk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;padding:7px 8px;border:0;background:none;border-radius:14px;text-align:left}
.tk:hover,.tk.sel{background:var(--paper-2)}
.tk .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#fff}
.tk b{font-weight:700;font-size:13.5px;display:block}
.tk small{font-size:11.5px;color:var(--muted)}
.tk .mark{font-size:12px;font-weight:700}
.tk .mark.todo{color:#c27a00}
.tk .mark.ok{color:var(--good)}
.tk.done .st{box-shadow:0 0 0 2px var(--coin)}

/* ---------- building card ---------- */
#card{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:92px;width:370px;max-height:calc(100% - 170px);display:flex;flex-direction:column;z-index:6;overflow:hidden}
#cardHead{padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px;position:relative;color:#fff;border-radius:20px 20px 0 0}
#cardHead .tag{background:rgba(255,255,255,.25)!important}
#cardHead .x{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);color:#fff}
.tag{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:999px;color:#fff}
#cardHead h2{font-size:27px;line-height:1.15;padding-right:36px}
#cardHead p{margin:0;font-size:13.5px;color:rgba(255,255,255,.92);line-height:1.65}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--paper-2);display:grid;place-items:center;font-size:19px;line-height:1}
#cardBody{overflow:auto;padding:6px 18px 16px;display:flex;flex-direction:column;gap:14px}
#cardFoot{padding:12px 18px 16px;border-top:2px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
#cardFoot .btn{flex:1}
.sec h3{font-size:14.5px;margin:8px 0 8px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:12px;height:9px;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--paper-2);border:1.5px solid var(--line)}
.certs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.certs li{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:7px 10px;border-radius:12px;background:var(--paper-2)}
.lv{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;align-self:center}
.lv.c{background:#d9efd2;color:#2f6b2a}.lv.b{background:#fde3b8;color:#8a5410}.lv.o{background:#dfe6f7;color:#34508f}
.note{font-size:12.5px;color:var(--muted);line-height:1.65;margin:0}
.quest{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff6d6;border:2px dashed #e8c45a;color:#5a4316}
.quest b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.quest small{font-size:12px}
.quest.ok{background:#e6f5df;border-color:#9ccc8c;color:#2f5b27}
.honor{display:flex;flex-direction:column;gap:6px}
.honor div{font-size:12.5px;line-height:1.6;padding:8px 10px;border-radius:12px;background:var(--paper-2)}
.honor a{color:var(--muted);font-size:11.5px}

/* ---------- radio ---------- */
#radio{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;max-width:min(640px,calc(100% - 32px));pointer-events:auto}
#radio .on{flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:linear-gradient(90deg,#ff6f5e,#ffb000);color:#fff;letter-spacing:.05em}
#radioTxt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;animation:pop .4s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 3D labels ---------- */
.bl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0;will-change:transform}
.bl .mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--coin);color:var(--coin-ink);box-shadow:0 3px 0 #c38f0b;animation:bob 1.6s ease-in-out infinite}
.bl.done .mk{background:var(--good);color:#fff;box-shadow:0 3px 0 #2e7a37;animation:none;font-size:15px}
.bl .nm small{display:block;font-size:10.5px;line-height:1.1;color:var(--muted);font-family:var(--f-body);font-weight:700;letter-spacing:.08em}
.bl.sel .nm small,.bl:hover .nm small{color:#6b5410}
.bt{position:absolute;left:0;top:0;font-family:var(--f-display);font-size:12px;padding:2px 9px;border-radius:8px;background:rgba(251,246,238,.85);color:#5a4a44;border:1.5px solid var(--line);white-space:nowrap;pointer-events:none}
.bt.gate{background:#3db4c9;color:#fff;border-color:#2a95a8;font-size:13px}
.bl .nm{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-family:var(--f-display);font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(110,70,60,.2);color:var(--ink)}
.bl.sel .nm,.bl:hover .nm{background:var(--coin);border-color:var(--coin);color:#3d2c00}
@keyframes bob{50%{transform:translateY(-5px)}}
.me{position:absolute;left:0;top:0;font-size:11px;font-weight:700;background:var(--brick);color:#fff;padding:2px 8px;border-radius:999px;pointer-events:none;white-space:nowrap}
.bub{position:absolute;left:0;top:0;background:#fffdf6;color:#463a37;border-radius:14px;padding:5px 10px;font-size:12px;max-width:190px;line-height:1.4;box-shadow:0 3px 0 rgba(0,0,0,.12);pointer-events:none;animation:pop .3s ease}
.bub b{display:block;font-size:10.5px;color:#a0857a}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fffdf6;border-bottom:0}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(50,30,25,.38);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.ov>.panel{width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}
.ovHead{padding:18px 20px 12px;position:relative;display:flex;flex-direction:column;gap:4px}
.ovHead h2{font-size:24px;padding-right:40px}
.ovHead p{margin:0;color:var(--muted);font-size:13px}
.ovBody{padding:4px 20px 20px;display:flex;flex-direction:column;gap:14px}

/* start */
#start{background:radial-gradient(circle at 15% 20%,rgba(255,210,63,.45) 0 12%,transparent 13%),radial-gradient(circle at 85% 30%,rgba(255,111,94,.4) 0 10%,transparent 11%),radial-gradient(circle at 25% 85%,rgba(31,162,230,.4) 0 9%,transparent 10%),radial-gradient(circle at 80% 80%,rgba(60,191,85,.4) 0 11%,transparent 12%),rgba(60,40,70,.28)}
#start .panel{width:min(520px,100%);text-align:center;padding:24px 22px 22px;gap:14px;align-items:center}
#start h1{font-size:clamp(38px,9vw,56px);letter-spacing:.08em;line-height:1.05;color:var(--ink)}
#start h1{text-shadow:0 4px 0 rgba(0,0,0,.08)}
#start .hi{font-family:var(--f-display);font-size:19px;margin:0}
#start .lead{margin:0;font-size:14.5px;line-height:1.8;color:var(--muted);max-width:30em}
.avatars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.av{width:72px;padding:6px 4px 4px;border-radius:18px;border:2px solid var(--line);background:var(--paper-2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700}
.av[aria-pressed="true"]{border-color:var(--brick);background:#ffe9e4;color:#8d3b30}
.av svg{width:54px;height:54px}
#nameIn{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--paper-2);color:var(--ink);font:inherit;font-size:15px;width:min(280px,100%);text-align:center}
#start .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#start .tiny{font-size:12px;color:var(--muted);margin:0}

/* game */
#game .panel{width:min(480px,100%)}
.gq{font-size:15.5px;line-height:1.7;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--paper-2);text-align:left;font-size:14.5px;font-weight:500}
.opt:hover{border-color:var(--brick)}
.opt.wrong{border-color:var(--bad);background:#fde5df;color:#8a2c1c;animation:shake .35s}
.opt.right,.opt.picked{border-color:var(--good);background:#e2f3dc;color:#24561d}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{padding:12px 4px;border-radius:16px;border:2px solid var(--line);background:var(--paper-2);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700}
.item span{font-size:30px;line-height:1}
.item[aria-pressed="true"]{border-color:var(--good);background:#e2f3dc}
.seqBtn{position:relative}
.seqBtn i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:13px;font-family:var(--f-num)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:1.5em;font-size:13.5px;font-weight:700;margin:0;color:var(--bad)}
.msg.ok{color:var(--good)}
.meter{position:relative;height:44px;border-radius:14px;background:repeating-linear-gradient(90deg,var(--paper-2) 0 18px,var(--line) 18px 20px);border:2px solid var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(95,174,74,.45);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--bad);border-radius:3px}
.pipes{display:flex;align-items:center;justify-content:center;gap:0}
.pipes .end{width:46px;height:64px;border-radius:12px;background:var(--pav);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.tile{width:64px;height:64px;border:2px solid var(--line);background:var(--paper-2);border-radius:10px;padding:0;display:grid;place-items:center}
.tile svg{width:56px;height:56px;transition:transform .2s}
.tile .w{fill:#c47f3e}
.pipes.flow .tile .w{fill:#4fb6e0}
.scale{display:flex;flex-direction:column;align-items:center;gap:6px}
.beam{width:260px;max-width:100%;height:10px;background:#8a6a45;border-radius:5px;position:relative;transition:transform .35s}
.pans{display:flex;justify-content:space-between;width:280px;max-width:100%}
.pan{width:110px;min-height:54px;border-radius:0 0 40px 40px;background:var(--paper-2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;padding:4px}
.pan .num{font-size:20px}
.coins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cbtn{width:58px;height:58px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff3b0 0 16%,#f7cf45 17% 64%,#d9a514 65%);box-shadow:inset 0 0 0 3px #c38f0b,0 3px 0 #b07f08;font-family:var(--f-num);font-weight:900;font-size:16px;color:#6b4b00}
.cbtn:disabled{opacity:.3}
.dots svg{width:100%;max-width:320px;display:block;margin:0 auto;background:#2f6aa3;border-radius:14px}
.light{width:120px;height:120px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:#fff;background:#9a8f8a;transition:background .1s}
.light.red{background:#d9573f}.light.green{background:#3f9d4b}
.bowl{font-size:70px;text-align:center;line-height:1;position:relative;user-select:none}
.steam{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:34px;transition:opacity .3s}
.win{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
.bigcoin{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2 0 16%,#f7cf45 17% 62%,#d9a514 63%);box-shadow:inset 0 0 0 5px #c38f0b,0 6px 0 #b07f08;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:#7a5600;animation:spin 1.6s ease-in-out infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
.win h3{font-size:24px}
.win p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}

/* passport */
#pass .panel{width:min(620px,100%)}
#pass .ovHead{background:linear-gradient(135deg,#7b2f3a,#a24a4f);color:#fff;border-radius:20px 20px 0 0}
#pass .ovHead p{color:#ffe3dc}
#pass .x{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff}
.passTop{display:flex;gap:14px;align-items:center}
.passTop svg{width:60px;height:60px;flex:none;background:#fff;border-radius:16px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.stamp{border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:14px}
.stamp:hover{background:var(--paper-2)}

function stepWalker(m,tgt,sp,t,phase,dt){
  const d=tgt.clone().sub(m.position); d.y=0; const L=d.length();
  if(L<sp){ m.position.x=tgt.x; m.position.z=tgt.z; return true; }
  m.position.addScaledVector(d,sp/L); const yaw=Math.atan2(d.x,d.z); m.rotation.y+=(((yaw-m.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*10);
  const sw=Math.sin(t*10+phase); const u=m.userData; u.legs[0].rotation.x=sw*.55; u.legs[1].rotation.x=-sw*.55; u.arms[0].rotation.set(-sw*.6,0,0); u.arms[1].rotation.set(sw*.6,0,0); m.position.y=Math.abs(sw)*.03; return false;
}
function updateWalkers(t,dt){

    if(!s.next){ const opts=ADJ[s.node].filter(n=>n!==s.prev && !['hilife','fish','c1','i0','pv'].includes(n)||Math.random()<.04); s.next=pick(opts.length?opts:ADJ[s.node]); s.target=NV(s.next).add(new THREE.Vector3(rnd(-.5,.5),0,rnd(-.5,.5))); }
    if(stepWalker(s.mesh,s.target,s.speed*dt,t,s.phase,dt)){ s.prev=s.node; s.node=s.next; s.next=null; if(Math.random()<.3) s.wait=rnd(1.5,5); }
  }
  if(player){ if(player.path.length){ const tgt=player.path[0]; if(stepWalker(player.mesh,tgt,player.speed*dt,t,0,dt)){ player.path.shift(); } } else { const u=player.mesh.userData; u.legs[0].rotation.x=u.legs[1].rotation.x=0; u.arms[0].rotation.set(0,0,0); u.arms[1].rotation.set(0,0,2.5+Math.sin(t*6)*.25); player.mesh.position.y=0; } }
}

  let cert;
  if(dn===DEPTS.length){
    cert=`<div class="cert"><h3>草商探索證書</h3><p>恭喜新生 <b>${esc(ST.name||'同學')}</b> 走遍草屯商工的 ${DEPTS.length} 個科別，完成探索任務，共收集 <b>${ST.done.length}</b> 枚金幣。</p>
    <p>${hearts.length?`你最有興趣的方向：<b>${hearts.map(h=>esc(h.name)).join('、')}</b>。${topGroup?`其中「${esc(topGroup[0])}」最吸引你，可以先看看這一群的證照和課程，或報名該科的體驗活動。`:''}`:'你還沒有在科別卡片按「♡ 我有興趣」。回去挑一個最想挑戰的科別，證書上就會出現你的方向！'}</p>
    <p class="note">${esc(SCHOOL.name)} · 校訓：${esc(SCHOOL.motto)}</p></div>`;
  } else {
    cert=`<div class="cert"><h3>我的方向</h3><p>再認識 <b>${DEPTS.length-dn}</b> 個科別，就能領取「草商探索證書」。</p><p>${hearts.length?`目前有興趣：${hearts.map(h=>esc(h.name)).join('、')}`:'在科別卡片按「♡ 我有興趣」，記下你想挑戰的方向。'}</p></div>`;
  }
  $('#pBody').innerHTML=`${cert}<section class="sec"><h3>科別印章 ${dn} / ${DEPTS.length}</h3><div class="stamps">${DEPTS.map(stamp).join('')}</div></section><section class="sec"><h3>校園生活印章</h3><div class="stamps">${Q.filter(q=>q.kind==='spot').map(stamp).join('')}</div></section><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="resetBtn">清除進度重新開始</button></div>`;
  $('#pass').hidden=false;
}
$('#pass').addEventListener('click',e=>{
  if(e.target.closest('[data-close="pass"]')||e.target.id==='pass'){ $('#pass').hidden=true; return; }
  const s=e.target.closest('.stamp'); if(s){ $('#pass').hidden=true; select(s.dataset.id,true); return; }
  const r=e.target.closest('#resetBtn'); if(r){ if(r.dataset.sure){ ST.done=[]; ST.hearts=[]; save(); refreshLabels(); renderTasks(); renderCard(); openPass(); toast('進度已清除'); } else { r.dataset.sure='1'; r.textContent='再按一次確認清除'; } }
});

/* ---------- start screen ---------- */
function renderAvatars(){ $('#avatars').innerHTML=AVATARS.map(a=>`<button class="av" data-a="${a.id}" aria-pressed="${ST.avatar===a.id}">${avaSVG(a.id)}${a.label}</button>`).join(''); }
$('#avatars').addEventListener('click',e=>{ const b=e.target.closest('.av'); if(!b) return; ST.avatar=b.dataset.a; renderAvatars(); });
function begin(){ ST.name=$('#nameIn').value.trim().slice(0,10); save(); $('#start').hidden=true; started=true; if(controls) controls.autoRotate=false; makePlayer(); refreshLabels(); home(); toast('點任何一棟建築就能開始探索！'); }
$('#startBtn').addEventListener('click',()=>{ if(!$('#contBtn').hidden && ST.done.length){ ST.done=[]; ST.hearts=[]; } begin(); renderTasks(); });
$('#contBtn').addEventListener('click',begin);
if(ST.done.length){ $('#contBtn').hidden=false; $('#contBtn').innerHTML=`<span class="coin"></span> 繼續探索（${ST.done.length} 枚金幣）`; $('#startBtn').textContent='重新領一本護照'; }
$('#nameIn').value=ST.name||'';

/* ---------- toolbar & misc ---------- */
$('#coinBtn').addEventListener('click',openPass); $('#passBtn').addEventListener('click',openPass);
$('#homeBtn').addEventListener('click',()=>{ select(null); home(); });
$('#taskBtn').addEventListener('click',()=>{ $('#tasks').classList.toggle('open'); if($('#tasks').classList.contains('open')) select(null); });
$('#infoBtn').addEventListener('click',()=>{
  $('#iBody').innerHTML=`<p><b>怎麼玩</b></p><ul><li>直接點建築（或上面的名牌）就能看科別介紹，不用走到門口；你的角色會自己走過去。</li><li>每棟建築都有一個小任務，完成後會顯示「你認識了這個科別！」並得到一枚金幣。</li><li>在科別卡片按「♡ 我有興趣」，十個科別都認識後，護照會發給你一張寫著你方向的「探索證書」。</li><li>拖曳可以轉動視角，捏合或滾輪可以縮放，點地面可以讓角色走過去。</li></ul>
  <p><b>校園廣播</b></p><p>底部的廣播與同學頭上的對話框來自課程 Discord（由 TA Bot 推送到 <code>api/feed</code>）。目前狀態：${feedMode==='live'?'即時':'示範內容'}。</p>
  <p><b>資料來源</b></p><ul>${SOURCES.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul>
  <p class="note">校園配置依「115 學年度全校平面圖」；北邊是中投快速道路，西邊是民房，正校門正對面是萊爾富、右手邊是南台灣土魠魚羹。誠工樓、誠教樓、藝升樓、誠學樓依實景照片做成三合院造型；比例為遊戲用的示意。校外商店以一般店面呈現。進度只存在這台裝置的瀏覽器裡。</p>`;
  $('#info').hidden=false; });
$('#info').addEventListener('click',e=>{ if(e.target.closest('[data-close="info"]')||e.target.id==='info') $('#info').hidden=true; });
addEventListener('keydown',e=>{ if(e.key!=='Escape') return; for(const id of ['game','pass','info']){ if(!$('#'+id).hidden){ if(id==='game') gameStop&&gameStop(); $('#'+id).hidden=true; return; } } select(null); });
function toast(text){ const t=$('#toast'); t.innerHTML='<span class="coin"></span><span></span>'; t.lastChild.textContent=text; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3200); }

/* =====================================================================
   CAMPUS RADIO — Discord feed from the TA Bot (api/feed), demo otherwise
   ===================================================================== */
const FEEDMAP={plaza:'tower',honor:'tower',discord:'tower',mech:'mech',pipe:'pipe',data:'data',acct:'acct',biz:'biz',eng:'eng',night:'night',life:'life',sport:'sport',cad:'mech'};
const NICK=['小齒輪','車床阿傑','螺帽','管線達人','銲花','記帳貓','借貸平衡','小算盤','Ctrl+S','404少年','門市小店長','行銷鳥','GEPT衝','藍圖君','跑道上的風','早起的蛋糕','夜讀星','扳手'];
const SAY={tower:['TA Bot：今天的校園探索打卡開始囉','圖書館本週新書上架','期中考週，自習教室延長開放'],mech:['車床練習公差壓到 0.02 了','CNC 程式模擬跑完，明天上機','工場打掃完畢，工具歸位'],pipe:['氣體燃料導管配管試壓一次就過','管線製圖作業交了','銲接面罩記得自己帶'],data:['網頁作業的 RWD 終於不跑版','電腦軟體應用第 3 題有人會嗎','試算表樞紐分析好好用'],acct:['人工記帳的分錄又借貸不平…','會計資訊練習賽成績出來了','成本會計作業週五截止'],biz:['門市服務情境演練：客訴應對','商業簡報初賽報名到週四','財金教室今天模擬投資'],eng:['English Corner 今天練問路','多益模擬考聽力進步了','英語簡報工作坊還有名額'],night:['下班趕來上課，今晚上機械製造','夜間資處班：函數複習'],life:['烘焙課做了餅乾，分給大家','職場實習：門市補貨練習'],sport:['晨訓 5 公里完成','比賽前一週調整課表'],m921:['TA Bot：九二一重建紀念亭今天有校史導覽'],cad:['3D 建模作業完成','建築平面圖圖層整理好了']};
const feedLog=[]; const seen=new Set(); let feedMode='demo', demoTimer=null;
function showFeed(e){
  feedLog.push(e); if(feedLog.length>60) feedLog.shift();
  const q=QI[e.q]; const r=$('#radioTxt'); r.textContent=`#${q?q.name:'校園'}　${e.user}：${e.text}`; r.style.animation='none'; void r.offsetWidth; r.style.animation='';
  const b=B[e.q]; if(!b) return; const bp=b.c;
  let best=null,bd=1e9; for(const s of students){ if(s.bubble) continue; const d=s.mesh.position.distanceToSquared(bp); if(d<bd){bd=d;best=s;} }
  if(!best) return; const el=document.createElement('div'); el.className='bub'; el.innerHTML='<b></b><span></span>'; el.firstChild.textContent=e.user; el.lastChild.textContent=e.text.length>34?e.text.slice(0,33)+'…':e.text; labelsEl.appendChild(el); best.bubble=el; best.wait=Math.max(best.wait,4.5);
  setTimeout(()=>{ el.remove(); best.bubble=null; },5000);
  if(selected===e.q&&QI[e.q].kind==='dept') renderCard();
}
function demoTick(){ const q=pick(['biz','biz','mech','data','acct','eng','pipe','tower','night','life','sport','m921']); showFeed({q,user:q==='tower'?'TA Bot':pick(NICK),text:pick(SAY[q])}); }
function startDemo(){ if(demoTimer) return; const loop=()=>{ demoTimer=setTimeout(()=>{ if(feedMode==='demo') demoTick(); loop(); },rnd(4500,8000)); }; loop(); }
async function poll(){
  try{ const r=await fetch('api/feed',{cache:'no-store'}); if(!r.ok||!(r.headers.get('content-type')||'').includes('json')) throw 0; const j=await r.json();
    const evs=(j.events||[]).filter(e=>e&&FEEDMAP[e.dept]).sort((a,b)=>(+a.ts||0)-(+b.ts||0)); const first=feedMode!=='live'; feedMode='live'; if(demoTimer){ clearTimeout(demoTimer); demoTimer=null; }
    const fresh=evs.filter(e=>!seen.has(String(e.id))); evs.forEach(e=>seen.add(String(e.id)));
    (first?fresh.slice(-3):fresh.slice(-6)).forEach((e,i)=>setTimeout(()=>showFeed({q:FEEDMAP[e.dept],user:String(e.user||'同學').slice(0,24),text:String(e.text||'').slice(0,120)}),i*1500));
  }catch(err){ if(feedMode!=='live') startDemo(); }
  setTimeout(poll,20000);
}

/* =====================================================================
   LOOP & BOOT
   ===================================================================== */
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return; camera.aspect=w/h; camera.fov=w<760?48:34; camera.updateProjectionMatrix(); renderer&&renderer.setSize(w,h,false); }
const clock=new THREE.Clock(); let T=0;
function frame(){
  const dt=Math.min(.05,clock.getDelta()); T+=dt*(reduceMotion?.4:1);
  for(const f of anim) f(T,dt);
  for(let i=fx.length-1;i>=0;i--) if(!fx[i](dt)) fx.splice(i,1);
  updateWalkers(T,dt);
  if(selRing.visible) selRing.material.opacity=.55+.4*Math.sin(T*4);
  if(fly){ fly.k+=dt/fly.dur; const k=Math.min(1,fly.k); const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(k>=1) fly=null; }
  controls&&controls.update();
  renderer.render(scene,camera); updateLabels(); requestAnimationFrame(frame);
}
try{ await Promise.race([document.fonts.load('48px Huninn'),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
buildCampus(); buildLabels(); refreshLabels(); renderTasks(); renderAvatars();
for(const h of HOMES) addStudent(h); for(let i=0;i<4;i++) addStudent(pick(Object.keys(N).filter(k=>!(k in WNODE))));
startDemo(); poll();
if(renderer){ new ResizeObserver(resize).observe(canvas); resize(); if(canvas.clientWidth<760) camera.position.set(-10,190,205); if(controls){ controls.autoRotate=!reduceMotion; controls.autoRotateSpeed=.5; } requestAnimationFrame(frame); }
</script>
