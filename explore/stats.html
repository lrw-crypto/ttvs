<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>草商探索趣 完成人數</title>
<!-- 與 index.html 相同：把 Google Apps Script 網頁應用程式的網址（…/exec）填在 content -->
<meta name="caotun-redeem-api" content="">
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#3d3040;--muted:#8a7a80;--line:#f0dcc6;--coin:#ffc531;--bar:#ff6f5e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#24212a;--card:#2f2b35;--ink:#f4ebe3;--muted:#bcaea6;--line:#4c4550;--bar:#ff8a7a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.tile b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-weight:700}
.chart{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;min-width:max-content;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;width:38px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;background:var(--bar);border-radius:6px 6px 0 0;min-height:2px}
.bar em{font-style:normal;color:var(--ink);font-weight:700}
.note{color:var(--muted);font-size:13px;margin:0}
button{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;align-self:flex-start}
#err{color:#d9573f;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>草商探索趣 完成人數</h1>
  <p class="note" id="when">讀取中…</p>
  <div class="tiles">
    <div class="tile"><b id="finished">–</b><small>累計完成遊戲（集滿 13 枚金幣）</small></div>
    <div class="tile"><b id="today">–</b><small>今天新增完成</small></div>
    <div class="tile"><b id="claimed">–</b><small>已發出小禮物號碼</small></div>
    <div class="tile"><b id="left">–</b><small>剩餘小禮物名額</small></div>
  </div>
  <section class="chart" aria-label="近 30 天每日完成人數"><b>近 30 天每日完成人數</b><div class="bars" id="bars"></div></section>
  <p id="err" hidden></p>
  <button id="reload">重新整理</button>
  <p class="note">一個瀏覽器只算一次；同一位學生換手機或清除瀏覽器資料後再玩，會被算成新的一位。日期以台灣時間計算。</p>
</main>
<script>
const API=(document.querySelector('meta[name="caotun-redeem-api"]').content||'').trim()||'api/redeem';
const $=id=>document.getElementById(id);
async function load(){
  $('err').hidden=true;
  try{
    const r=await fetch(API,{cache:'no-store'}); const isJson=(r.headers.get('content-type')||'').includes('json'); const j=isJson?await r.json():{}; if(!r.ok||!isJson) throw new Error(j.error||('找不到統計 API，HTTP '+r.status));
    $('finished').textContent=j.finished; $('today').textContent=j.today; $('claimed').textContent=`${j.claimed} / ${j.limit}`; $('left').textContent=j.left;
    const days=Object.entries(j.daily||{}); const max=Math.max(1,...days.map(d=>d[1]));
    $('bars').innerHTML=days.length?days.map(([d,n])=>`<div class="bar"><em>${n}</em><i style="height:${Math.round(n/max*120)}px"></i><span>${d.slice(5).replace('-','/')}</span></div>`).join(''):'<p class="note">還沒有人完成。</p>';
    $('when').textContent='更新時間：'+new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
  }catch(e){ $('err').textContent='讀不到統計資料：'+e.message+'。請確認 Google Apps Script 已部署成網頁應用程式（存取權：所有人），並在這個檔案開頭填好 /exec 網址。'; $('err').hidden=false; $('when').textContent=''; }
}
$('reload').onclick=load; load();
</script>
</body>
</html>
