name: Verify published RPG

on:
  push:
    branches: [gh-pages]

permissions:
  contents: read

concurrency:
  group: verify-public-game
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for Pages and verify this exact release
        run: node .github/verify-live.mjs https://lrw-crypto.github.io/ttvs/ release.json
